[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    -ra
markers =
    smoke: быстрые критичные проверки
    auth: сценарии авторизации в Паспорте
    negative: негативные сценарии
    recovery: восстановление доступа
